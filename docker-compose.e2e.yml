# Ephemeral Firefly III for the e2e suite. Bootstrapped by scripts/e2e/up.sh and
# torn down by `npm run e2e:down`. Nothing here persists: the database lives on
# tmpfs, so every `up` starts from an empty ledger.
#
# APP_KEY is read from .e2e/app-key (generated by up.sh) as a compose secret,
# via Firefly's APP_KEY_FILE support. A file rather than ${APP_KEY:?} keeps
# `docker compose ... port/down` usable without exporting anything.
name: btk-e2e

services:
    db:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        restart: 'no'
        environment:
            POSTGRES_USER: firefly
            # Not a secret: the port is never published and the data is on tmpfs.
            POSTGRES_PASSWORD: btk-e2e
            POSTGRES_DB: firefly
            TZ: UTC
        tmpfs:
            # pg18 images keep PGDATA at /var/lib/postgresql/18/docker.
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U firefly -d firefly']
            interval: 2s
            timeout: 2s
            retries: 30

    firefly:
        image: fireflyiii/core:version-6.6.6@sha256:ae69fdd95cdef9038cd7a460a5aec731f14813973e4f096511d5a4ea9ff0e972
        restart: 'no'
        depends_on:
            db:
                condition: service_healthy
        environment:
            APP_KEY_FILE: /run/secrets/app_key
            APP_ENV: local
            APP_DEBUG: 'false'
            APP_URL: http://127.0.0.1
            SITE_OWNER: e2e@btk.invalid
            TZ: UTC
            DEFAULT_LANGUAGE: en_US
            TRUSTED_PROXIES: '**'
            LOG_CHANNEL: stdout
            LOG_LEVEL: warning
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: '5432'
            DB_DATABASE: firefly
            DB_USERNAME: firefly
            DB_PASSWORD: btk-e2e
            MAIL_MAILER: log
            MAIL_FROM: e2e@btk.invalid
        secrets:
            - app_key
        ports:
            # Ephemeral host port, loopback only. up.sh resolves it.
            - '127.0.0.1::8080'
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 10s

secrets:
    app_key:
        file: ./.e2e/app-key
